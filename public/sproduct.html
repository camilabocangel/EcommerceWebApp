<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <img src="img/logo.png" class="logo" style="width: 150px; height: auto;">
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html"><i class="far fa-shopping-bag"></i></a></li>
                <li id="nav-login"><a href="login.html">Sign in</a></li>
                <li id="nav-session"></li>
            </ul>
        </div>
    </section>

    <section id="prodetails" class="section-p1">
        <div class="single-pro-image">
            <img id="MainImg" src="img/default.jpg" alt="Product Image" width="100%">
        </div>

        <div class="single-pro-details">
            <h6>Home / Sneakers</h6>
            <h4 id="productName">Sneakers</h4>

            <p><strong>Brand:</strong> <span id="productBrand"></span></p>
            <p><strong>Year:</strong> <span id="productYear"></span></p>
            <p><strong>Price:</strong> $<span id="productPrice"></span></p>

            

            <label for="quantityInput">Quantity:</label>
            <input type="number" id="quantityInput" min="1" value="1">
            
            <button id="addToCart" class="normal">Add to Cart</button>
        </div>
    </section>

    <footer class="section-p1">
        <div class="col">
            <img src="img/logo.png" class="logo" style="width: 150px; height: auto;">
            <h4>Contact</h4>
            <p><strong>Joaquin Aguilera - </strong>78619</p>
            <p><strong>Camila Bocangel - </strong>76625</p>
            <p><strong>Santiago Acha - </strong>77251</p>
        </div>
        <div class="col methods">
            <p>Secured Payment Gateways</p>
            <img src="img/pay.png">
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="script.js"></script>

    <script>
        function getProductId() {
            return new URLSearchParams(window.location.search).get("id");
        }

        const productId = getProductId();
        let productoActual = null;  // guardará uuid y stock

        if (productId) {
            fetch(`/api/products/${productId}`)
                .then(response => {
                    if (!response.ok) throw new Error("Product not found");
                    return response.json();
                })
                .then(product => {
                    productoActual = product;   // incluye uuid (enlace con Postgres) y quantity (stock Mongo)
                    document.getElementById("productName").textContent = product.brand + " " + product.name;
                    document.getElementById("productBrand").textContent = product.brand;
                    document.getElementById("productYear").textContent = product.year;
                    document.getElementById("productPrice").textContent = product.price;
                    if (product.image) document.getElementById("MainImg").src = product.image;
                })
                .catch(error => console.error(error));
        }

        document.getElementById("addToCart").addEventListener("click", async () => {
            if (!productoActual) return alert("Product not found.");
            if (!Auth.requerir()) return;  // exige login

            const quantity = parseInt(document.getElementById("quantityInput").value, 10);
            if (!quantity || quantity < 1) return alert("Invalid quantity.");
            if (quantity > productoActual.quantity) return alert("Not enough stock available.");

            try {
                // Carrito en el servidor (MongoDB) enlazado por producto_uuid
                const res = await Auth.fetch('/api/cart', {
                    method: 'POST',
                    body: JSON.stringify({ producto_uuid: productoActual.uuid, cantidad: quantity })
                });
                if (!res.ok) throw new Error((await res.json()).error || 'Could not add to cart');
                window.location.href = 'cart.html';
            } catch (e) {
                alert(e.message);
            }
        });
    </script>
    


</body>

</html>
