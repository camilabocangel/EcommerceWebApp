<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Ecommerce</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logo.png" class="logo" style="width:150px;height:auto;"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li id="lg-bag"><a class="active" href="cart.html"><i class="far fa-shopping-bag"></i></a></li>
                <li id="nav-login"><a href="login.html">Sign in</a></li>
                <li id="nav-session"></li>
            </ul>
        </div>
    </section>

    <section id="cart" class="section-p1">
        <table width="100%">
            <thead>
                <tr>
                    <td>Remove</td><td>Image</td><td>Product</td><td>Price</td><td>Quantity</td><td>Subtotal</td>
                </tr>
            </thead>
            <tbody id="cart-table-body"></tbody>
        </table>
    </section>

    <section id="cart-add" class="section-p1">
        <div id="subtotal">
            <h3>Cart totals</h3>
            <table>
                <tr><td>Subtotal</td><td id="cart-subtotal">$0</td></tr>
                <tr><td>Shipping</td><td>Free</td></tr>
                <tr><td><strong>Total</strong></td><td id="cart-total"><strong>$0</strong></td></tr>
            </table>

            <div class="pay-method-wrapper">
                <h4>Pay with card</h4>
                <div id="creditCardDetails">
                    <label for="cardNumber">Card number:</label>
                    <input type="text" id="cardNumber" placeholder="16 digits" value="4111111111111111">
                    <label for="cardExpiry">Expiry (MMYY):</label>
                    <input type="text" id="cardExpiry" placeholder="MMYY" value="1230">
                    <label for="cardCvc">CVC:</label>
                    <input type="text" id="cardCvc" placeholder="3 digits" value="123">
                    <button class="normal" id="completePurchase">Complete purchase</button>
                </div>
                <p id="msg" style="min-height:20px;"></p>
            </div>
        </div>
    </section>

    <footer class="section-p1">
        <div class="col">
            <img src="img/logo.png" class="logo" style="width:150px;height:auto;">
            <h4>Contact</h4>
            <p><strong>Joaquin Aguilera - </strong>78619</p>
            <p><strong>Camila Bocangel - </strong>76625</p>
            <p><strong>Santiago Acha - </strong>77251</p>
        </div>
        <div class="col methods">
            <p>Secured Payment Gateways</p>
            <img src="img/pay.png">
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        const tbody = document.getElementById('cart-table-body');
        const msg = document.getElementById('msg');

        async function cargarCarrito() {
            if (!Auth.requerir()) return;
            tbody.innerHTML = '';
            // Carrito del servidor (Mongo) + detalle de productos del catálogo
            const [cartRes, prodRes] = await Promise.all([
                Auth.fetch('/api/cart'),
                fetch('/api/products')
            ]);
            const cart = await cartRes.json();
            const products = await prodRes.json();
            const byUuid = Object.fromEntries(products.map(p => [p.uuid, p]));

            if (!cart.items || cart.items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">Your cart is empty.</td></tr>';
                document.getElementById('cart-subtotal').textContent = '$0';
                document.getElementById('cart-total').textContent = '$0';
                return;
            }

            let total = 0;
            cart.items.forEach(item => {
                const p = byUuid[item.producto_uuid];
                if (!p) return;
                const subtotal = p.price * item.cantidad;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td><a href="#" class="remove-item" data-uuid="${item.producto_uuid}"><i class="far fa-times-circle"></i></a></td>
                        <td><img src="${p.image}" alt="${p.name}" width="50"></td>
                        <td>${p.brand} ${p.name}</td>
                        <td>$${p.price}</td>
                        <td>${item.cantidad}</td>
                        <td>$${subtotal}</td>
                    </tr>`;
            });
            document.getElementById('cart-subtotal').textContent = `$${total}`;
            document.getElementById('cart-total').textContent = `$${total}`;

            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await Auth.fetch('/api/cart', {
                        method: 'DELETE',
                        body: JSON.stringify({ producto_uuid: btn.getAttribute('data-uuid') })
                    });
                    cargarCarrito();
                });
            });
        }

        function validarTarjeta() {
            const num = document.getElementById('cardNumber').value;
            const exp = document.getElementById('cardExpiry').value;
            const cvc = document.getElementById('cardCvc').value;
            if (!/^\d{16}$/.test(num)) return 'Card number must be 16 digits.';
            if (!/^\d{4}$/.test(exp)) return 'Expiry must be MMYY (4 digits).';
            if (!/^\d{3}$/.test(cvc)) return 'CVC must be 3 digits.';
            return null;
        }

        document.getElementById('completePurchase').addEventListener('click', async () => {
            msg.style.color = '#c00';
            const err = validarTarjeta();
            if (err) { msg.textContent = err; return; }
            const num = document.getElementById('cardNumber').value;
            try {
                // El número NO se guarda en claro: el backend lo cifra (pgcrypto). Solo se
                // envía para tokenizar; se conservan ultimos4 + token cifrado.
                const res = await Auth.fetch('/api/checkout', {
                    method: 'POST',
                    body: JSON.stringify({ metodo: 'tarjeta', token: num, ultimos4: num.slice(-4) })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Checkout error');
                msg.style.color = '#088';
                msg.textContent = `Purchase completed. Invoice ${data.numero_factura} — Total $${data.total}`;
                cargarCarrito();
            } catch (e) {
                msg.textContent = e.message;
            }
        });

        cargarCarrito();
    </script>
</body>

</html>
